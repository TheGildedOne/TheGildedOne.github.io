<article class="post">
  <header class="post-head">
    <p class="post-meta">
      <a class="cat" href="/archive/#{{category_slug}}">{{category}}</a>
      <time datetime="{{date_iso}}">{{date_human}}</time>
      <span class="rt">{{read_minutes}} min &middot; {{word_count}} words</span>
    </p>
    <h1>{{title}}</h1>
    <p class="dek">{{dek}}</p>
  </header>

  {{toc}}

  <div class="prose">
{{body}}
  </div>

  {{faq}}
  {{sources}}

  <p class="tags">{{tags}}</p>
</article>

{{related}}
