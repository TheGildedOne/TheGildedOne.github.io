name: Strip archive utm tags (one-off)

# Temporary, added 2026-11-02 and removed once run. See tools/strip_archive_utm.py.
# Runs here because this repo holds the BUTTONDOWN_API_KEY secret.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report (read-only), test-one, or apply"
        type: choice
        options: [report, test-one, apply]
        default: report

permissions:
  contents: read

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Strip utm tags from archived emails
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python tools/strip_archive_utm.py ${{ inputs.mode != 'report' && format('--{0}', inputs.mode) || '' }}
