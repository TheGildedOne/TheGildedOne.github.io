name: Publish

# Rebuilds the site every morning. Posts appear on their scheduled date without
# anyone touching anything — build.py --live only includes posts whose date has
# arrived. Also runs on every push, so edits go out immediately.

on:
  schedule:
    # Two runs a day, deliberately. GitHub treats scheduled workflows as
    # best-effort and deprioritises them under load: the 09:05 run drifted to
    # 19:47 UTC on 2026-08-27 and was dropped entirely on 2026-08-28, leaving a
    # due post unpublished with every local check still reporting healthy.
    #
    # The second run is a backup, not a second publish. Everything downstream is
    # idempotent, so it is free: build.py --live emits exactly the posts whose
    # date has arrived, and notify_subscribers.py matches on subject against
    # Buttondown before sending, so nobody gets a post twice.
    - cron: "5 9 * * *"      # 09:05 UTC
    - cron: "5 15 * * *"     # 15:05 UTC, backup if the morning run is dropped
  push:
    branches: [main]
  workflow_dispatch:         # manual "publish now" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build published posts
        run: python build.py --live

      - name: Validate links and SEO tags
        run: python check.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Independent of build/deploy on purpose: publishing must never be blocked by a
  # warning about the future, but a short runway must still turn the run red so
  # GitHub emails about it. The writing loop lives on a local machine and has
  # already failed silently once.
  runway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check publishing runway
        run: python tools/check_runway.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing (and therefore Copilot / AI search) about new URLs immediately
      # rather than waiting to be crawled. Never fails the deploy.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python build.py --live
          python tools/indexnow.py

      # Email the newsletter list when a post goes live. Buttondown charges for
      # its built-in RSS-to-email; its API is free, so we do it ourselves. The
      # script no-ops when nothing published today, when the secret is absent,
      # and when Buttondown already has an email with that subject.
      - name: Email subscribers
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          pip install --quiet requests
          python tools/notify_subscribers.py
